#HelpView.java
label.infoHelp=================================================================\n \
TERMINAL COMMAND GUIDE (Simplified UNIX Subset)\n \
================================================================\n \
\n \
pwd\n \
Prints the current working directory (Print Working Directory).\n \
\n \
touch FILE...\n \
Creates one or more empty text files.\n \
\n \
mkdir DIRECTORY...\n \
Creates one or more new directories (folders).\n \
\n \
cd [DIRECTORY]\n \
Changes the current directory. If [DIRECTORY] is not specified,\n \
the typical behavior is to return to the home directory.\n \
\n \
rm FILE...\n \
Removes (deletes) the specified files.\n \
\n \
rmdir DIRECTORY...\n \
Removes (deletes) the specified directories. Only works if the directories are empty.\n \
\n \
mv SOURCE DESTINATION\n \
Moves a file/directory (SOURCE) to a new location/name (DESTINATION).\n \
Also acts as a rename command.\n \
\n \
ln [-s] TARGET LINK_NAME\n \
Creates a link.\n \
- Without -s: Creates a hard link (not supported for directories).\n \
- With -s: Creates a soft link (symbolic link) to TARGET.\n \
\n \
ls [-i] FILE...\n \
Lists the directory contents.\n \
- -i option: Shows the inode number for each item.\n \
\n \
clear\n \
Clears the terminal output area.\n \
\n \
help\n \
Shows this list of available commands and their syntax.\n \
\n \
exit\n \
Closes the terminal application.

