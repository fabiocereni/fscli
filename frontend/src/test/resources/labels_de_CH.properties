TERMINAL-BEFEHLSANLEITUNG (Vereinfachtes UNIX-Subset)\n \
================================================================\n \
\n \
pwd\n \
Gibt das aktuelle Arbeitsverzeichnis aus (Print Working Directory).\n \
\n \
touch DATEI...\n \
Erstellt eine oder mehrere leere Textdateien.\n \
\n \
mkdir VERZEICHNIS...\n \
Erstellt ein oder mehrere neue Verzeichnisse (Ordner).\n \
\n \
cd [VERZEICHNIS]\n \
Wechselt das aktuelle Verzeichnis. Wenn [VERZEICHNIS] nicht angegeben ist,\n \
ist das typische Verhalten, in das Home-Verzeichnis zur\u00FCckzukehren.\n \
\n \
rm DATEI...\n \
Entfernt (l