variables:
  # Maven settings
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.showDateTime=true

  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    --no-transfer-progress
    --no-snapshot-updates

stages:
  - backend
  - frontend

cache:
  key: "maven-$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

# =========================
# BACKEND
# =========================
backend:
  stage: backend
  image: gitlab-edu.supsi.ch:5050/dti-isin/labingsw/common:maven3java17
  before_script:
    - cd backend
  script:
    - mvn $MAVEN_OPTS $MAVEN_CLI_OPTS clean install
  after_script:
    - cd ..
  artifacts:
    paths:
      - backend/target/fscli-backend.jar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

# =========================
# FRONTEND (JavaFX + TestFX)
# =========================
frontend:
  stage: frontend
  image: gitlab-edu.supsi.ch:5050/dti-isin/labingsw/common:maven3java17

  before_script:
    - cd frontend
    - Xvfb :99 -ac -screen 0 1920x1080x24 &
    - export DISPLAY=:99

  script:
    - mvn $MAVEN_OPTS $MAVEN_CLI_OPTS -Dheadless=true -Dsw-renderer=true -Dmonocle=true clean test

  after_script:
    - cd ..

  artifacts:
    paths:
      - frontend/target/fscli-jar-with-dependencies.jar
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'